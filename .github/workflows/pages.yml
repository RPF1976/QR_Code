name: Deploy QR Fácil para GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pré-requisito (uma única vez, manual — nenhum token de workflow consegue
      # fazer isso via API): no repositório, Settings → Pages → Build and
      # deployment → Source: "GitHub Actions". Sem isso, este passo falha com
      # 404 ("Not Found"); 'enablement: true' também não resolve, pois criar o
      # site Pages exige permissão de administração do repositório, que o
      # GITHUB_TOKEN não tem nem pode receber.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
